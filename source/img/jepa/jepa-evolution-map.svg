<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="title desc">
  <title id="title">JEPA 从表示预测到价值引导规划的演进</title>
  <desc id="desc">三张卡片依次展示 I-JEPA、LLM-JEPA 和 Value-Guided JEPA，从预测被遮挡表示，走向跨视图语义预测，再走向适合行动规划的潜空间几何。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fa"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="axis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="0.5" stop-color="#8250df"/>
      <stop offset="1" stop-color="#1a7f37"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2328" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#57606a"/>
    </marker>
    <marker id="green-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a7f37"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .headline { font-size: 21px; font-weight: 700; fill: #1f2328; }
      .subtitle { font-size: 12px; fill: #57606a; }
      .card-title { font-size: 17px; font-weight: 700; }
      .card-kicker { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
      .body { font-size: 12px; fill: #1f2328; }
      .tiny { font-size: 10px; fill: #57606a; }
      .axis-label { font-size: 11px; font-weight: 600; fill: #57606a; }
    </style>
  </defs>

  <rect width="720" height="430" rx="16" fill="url(#bg)"/>
  <text x="360" y="35" text-anchor="middle" class="headline">JEPA 的两次延续</text>
  <text x="360" y="56" text-anchor="middle" class="subtitle">同一种研究偏好，在视觉、语言与行动中承担了不同角色</text>

  <g filter="url(#shadow)">
    <rect x="25" y="82" width="210" height="250" rx="14" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/>
    <rect x="255" y="82" width="210" height="250" rx="14" fill="#ffffff" stroke="#a475f9" stroke-width="1.5"/>
    <rect x="485" y="82" width="210" height="250" rx="14" fill="#ffffff" stroke="#4ac26b" stroke-width="1.5"/>
  </g>

  <text x="43" y="108" class="card-kicker" fill="#0969da">视觉表征</text>
  <text x="43" y="133" class="card-title" fill="#0969da">I-JEPA</text>
  <g transform="translate(44 151)">
    <rect width="78" height="78" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <path d="M26 0V78 M52 0V78 M0 26H78 M0 52H78" stroke="#8cceff"/>
    <rect x="27" y="27" width="24" height="24" rx="4" fill="#ffebe9" stroke="#ff8182" stroke-width="2"/>
    <text x="39" y="43" text-anchor="middle" class="tiny" fill="#cf222e">?</text>
    <path d="M91 39H119" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="141" cy="22" r="8" fill="#54aeff"/>
    <circle cx="159" cy="39" r="8" fill="#0969da"/>
    <circle cx="141" cy="56" r="8" fill="#80ccff"/>
  </g>
  <text x="43" y="255" class="body">预测被遮挡区域的表示</text>
  <text x="43" y="278" class="tiny">不重建每个像素</text>
  <text x="43" y="297" class="tiny">用预测任务塑造 Encoder</text>

  <text x="273" y="108" class="card-kicker" fill="#8250df">语言双视图</text>
  <text x="273" y="133" class="card-title" fill="#8250df">LLM-JEPA</text>
  <g transform="translate(270 153)">
    <rect x="0" y="16" width="43" height="38" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="21.5" y="40" text-anchor="middle" class="tiny" fill="#0969da">Text</text>
    <path d="M47 35H60" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="65" y="8" width="72" height="54" rx="10" fill="#fbefff" stroke="#a475f9"/>
    <text x="101" y="30" text-anchor="middle" class="tiny" fill="#8250df">同一个 LLM</text>
    <text x="101" y="48" text-anchor="middle" class="tiny" fill="#8250df">[PRED]</text>
    <path d="M141 35H151" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="156" y="16" width="38" height="38" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="175" y="40" text-anchor="middle" class="tiny" fill="#9a6700">Code</text>
  </g>
  <text x="273" y="255" class="body">预测另一种表达的整体表示</text>
  <text x="273" y="278" class="tiny">NTP 仍然保留</text>
  <text x="273" y="297" class="tiny">JEPA 分支只服务训练</text>

  <text x="503" y="108" class="card-kicker" fill="#1a7f37">行动规划</text>
  <text x="503" y="133" class="card-title" fill="#1a7f37">Value-Guided JEPA</text>
  <g transform="translate(505 149)">
    <rect x="0" y="0" width="170" height="84" rx="9" fill="#f6fff8" stroke="#8ddb9b"/>
    <rect x="79" y="8" width="13" height="60" rx="3" fill="#ffebe9" stroke="#ff8182"/>
    <circle cx="30" cy="37" r="11" fill="#0969da"/>
    <text x="30" y="41" text-anchor="middle" class="tiny" fill="#ffffff">S</text>
    <circle cx="142" cy="37" r="11" fill="#1a7f37"/>
    <text x="142" y="41" text-anchor="middle" class="tiny" fill="#ffffff">G</text>
    <path d="M41 40 C48 78, 121 79, 132 47" fill="none" stroke="#1a7f37" stroke-width="4" stroke-linecap="round" marker-end="url(#green-arrow)"/>
    <path d="M42 37H76" stroke="#cf222e" stroke-width="2" stroke-dasharray="4 3"/>
  </g>
  <text x="503" y="255" class="body">让表示距离近似行动代价</text>
  <text x="503" y="278" class="tiny">Predictor 在 MPC 中持续运行</text>
  <text x="503" y="297" class="tiny">价值函数重画潜空间地图</text>

  <path d="M235 206H247" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M465 206H477" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="55" y="365" width="610" height="6" rx="3" fill="url(#axis)"/>
  <circle cx="55" cy="368" r="7" fill="#0969da"/>
  <circle cx="360" cy="368" r="7" fill="#8250df"/>
  <circle cx="665" cy="368" r="7" fill="#1a7f37"/>
  <text x="55" y="394" text-anchor="start" class="axis-label">可预测的表示</text>
  <text x="360" y="394" text-anchor="middle" class="axis-label">跨视图语义</text>
  <text x="665" y="394" text-anchor="end" class="axis-label">可规划的几何</text>
  <text x="360" y="418" text-anchor="middle" class="subtitle">从“预测什么”，走向“为了什么而预测”</text>
</svg>
