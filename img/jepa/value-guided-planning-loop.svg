<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Value-Guided JEPA 的 MPC 规划闭环</title>
  <desc id="desc">当前状态经过编码器进入潜空间，Predictor 对多个动作序列进行滚动预测，价值或准距离为候选未来评分，MPPI 选择第一步动作，执行后重新观察并重复规划。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fa"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#57606a"/>
    </marker>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a7f37"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .headline { font-size: 21px; font-weight: 700; fill: #1f2328; }
      .box-title { font-size: 13px; font-weight: 700; }
      .body { font-size: 11px; fill: #1f2328; }
      .tiny { font-size: 10px; fill: #57606a; }
      .step { font-size: 11px; font-weight: 600; }
      .light { fill: #ffffff; }
      .muted-light { fill: #d0d7de; }
    </style>
  </defs>

  <rect width="720" height="500" rx="16" fill="url(#bg)"/>
  <text x="360" y="34" text-anchor="middle" class="headline">Value-Guided JEPA：在潜空间里想象、评分、行动、再规划</text>

  <rect x="446" y="52" width="246" height="78" rx="12" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="462" y="75" class="box-title" fill="#9a6700">分阶段训练（Sep）</text>
  <circle cx="466" cy="94" r="10" fill="#0969da"/>
  <text x="466" y="98" text-anchor="middle" class="tiny" fill="#ffffff">1</text>
  <text x="483" y="98" class="step" fill="#57606a">value loss 先塑造 Encoder 几何</text>
  <circle cx="466" cy="116" r="10" fill="#bf8700"/>
  <text x="466" y="120" text-anchor="middle" class="tiny" fill="#ffffff">2</text>
  <text x="483" y="120" class="step" fill="#57606a">冻结 Encoder，再训练 Predictor</text>

  <rect x="28" y="151" width="113" height="74" rx="12" fill="#ddf4ff" stroke="#54aeff" filter="url(#shadow)"/>
  <text x="84.5" y="179" text-anchor="middle" class="box-title" fill="#0969da">当前状态 s_t</text>
  <rect x="49" y="190" width="72" height="20" rx="5" fill="#ffffff" stroke="#8cceff"/>
  <circle cx="62" cy="200" r="5" fill="#0969da"/>
  <rect x="82" y="194" width="29" height="12" rx="3" fill="#afb8c1"/>
  <path d="M141 188H177" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="188" y="157" width="105" height="62" rx="11" fill="#ddf4ff" stroke="#54aeff" filter="url(#shadow)"/>
  <text x="240.5" y="183" text-anchor="middle" class="box-title" fill="#0969da">Encoder E</text>
  <text x="240.5" y="202" text-anchor="middle" class="tiny">value-shaped</text>
  <path d="M293 188H326" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="351" cy="188" r="24" fill="#fbefff" stroke="#a475f9" stroke-width="1.5"/>
  <text x="351" y="184" text-anchor="middle" class="box-title" fill="#8250df">z_t</text>
  <text x="351" y="201" text-anchor="middle" class="tiny">latent</text>
  <path d="M375 188H406" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="417" y="151" width="120" height="74" rx="12" fill="#fff8c5" stroke="#d4a72c" filter="url(#shadow)"/>
  <text x="477" y="177" text-anchor="middle" class="box-title" fill="#9a6700">Predictor rollout</text>
  <text x="477" y="196" text-anchor="middle" class="tiny">z_hat(t+1), z_hat(t+2), ...</text>
  <text x="477" y="212" text-anchor="middle" class="tiny">候选动作序列</text>
  <path d="M537 188H569" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="580" y="144" width="112" height="88" rx="12" fill="#f6f8fa" stroke="#afb8c1" filter="url(#shadow)"/>
  <text x="636" y="165" text-anchor="middle" class="box-title" fill="#57606a">候选未来</text>
  <circle cx="603" cy="210" r="5" fill="#0969da"/>
  <path d="M603 210 C614 175, 646 178, 668 190" fill="none" stroke="#cf222e" stroke-width="2"/>
  <path d="M603 210 C619 196, 647 206, 674 215" fill="none" stroke="#bf8700" stroke-width="2"/>
  <path d="M603 210 C620 226, 650 224, 676 185" fill="none" stroke="#1a7f37" stroke-width="3" marker-end="url(#green-arrow)"/>

  <path d="M636 232V267" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="552" y="278" width="140" height="66" rx="12" fill="#dafbe1" stroke="#4ac26b" filter="url(#shadow)"/>
  <text x="622" y="302" text-anchor="middle" class="box-title" fill="#1a7f37">value / quasi-distance</text>
  <text x="622" y="321" text-anchor="middle" class="tiny">哪些未来真正更接近目标？</text>
  <text x="622" y="336" text-anchor="middle" class="tiny">对候选轨迹评分</text>
  <path d="M552 311H502" stroke="#1a7f37" stroke-width="2" marker-end="url(#green-arrow)"/>

  <rect x="391" y="278" width="100" height="66" rx="12" fill="#fbefff" stroke="#a475f9" filter="url(#shadow)"/>
  <text x="441" y="305" text-anchor="middle" class="box-title" fill="#8250df">MPPI</text>
  <text x="441" y="324" text-anchor="middle" class="tiny">搜索与加权</text>
  <text x="441" y="338" text-anchor="middle" class="tiny">只选第一步</text>
  <path d="M391 311H341" stroke="#8250df" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="230" y="278" width="100" height="66" rx="12" fill="#fbefff" stroke="#a475f9" filter="url(#shadow)"/>
  <text x="280" y="305" text-anchor="middle" class="box-title" fill="#8250df">动作 a_t*</text>
  <text x="280" y="326" text-anchor="middle" class="tiny">当前最优一步</text>
  <path d="M230 311H180" stroke="#8250df" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="278" width="129" height="66" rx="12" fill="#ffebe9" stroke="#ff8182" filter="url(#shadow)"/>
  <text x="104.5" y="304" text-anchor="middle" class="box-title" fill="#cf222e">执行 + 新观察</text>
  <text x="104.5" y="325" text-anchor="middle" class="tiny">只在真实世界走一步</text>

  <path d="M84 278 C48 263, 34 240, 49 218" fill="none" stroke="#cf222e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="27" y="257" class="tiny" fill="#cf222e">replan</text>

  <rect x="75" y="392" width="570" height="58" rx="14" fill="#24292f"/>
  <text x="360" y="415" text-anchor="middle" class="body light">Predictor 负责“未来会怎样”，value-shaped distance 负责“哪条未来值得走”</text>
  <text x="360" y="437" text-anchor="middle" class="tiny muted-light">每执行一步都重新观察，世界模型不需要一次把整条轨迹算对</text>
  <text x="360" y="481" text-anchor="middle" class="tiny">训练时分阶段 · 推理时闭环协作</text>
</svg>
