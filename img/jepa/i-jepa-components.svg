<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <defs>
    <style>
      .box { rx: 6; ry: 6; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; }
      .note { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #586069; }
      .arrow { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-head { fill: #57606a; }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" fill="#ffffff"/>

  <!-- Top: Input -->
  <text x="360" y="30" text-anchor="middle" class="label" fill="#24292f">真实世界输入 x（图像）</text>

  <!-- Arrow down to Context Encoder -->
  <line x1="360" y1="38" x2="360" y2="70" class="arrow" stroke="#57606a" marker-end="url(#ah)"/>

  <!-- Context Encoder Box -->
  <rect x="230" y="75" width="260" height="60" fill="#ddf4ff" stroke="#54aeff" stroke-width="2" class="box"/>
  <text x="360" y="105" text-anchor="middle" class="title" fill="#0969da">Context Encoder</text>
  <text x="360" y="125" text-anchor="middle" class="note">感知模块：把感官数据压缩成"当下世界状态"</text>

  <!-- Arrow: s_context -->
  <line x1="360" y1="135" x2="360" y2="165" class="arrow" stroke="#0969da" stroke-width="2" marker-end="url(#ah)"/>
  <text x="390" y="155" class="note" fill="#0969da">sₜ</text>

  <!-- Middle: Action input -->
  <text x="100" y="185" text-anchor="middle" class="label" fill="#57606a">动作 aₜ</text>
  <line x1="130" y1="180" x2="280" y2="180" class="arrow" stroke="#57606a" marker-end="url(#ah)"/>

  <!-- Predictor Box -->
  <rect x="230" y="170" width="260" height="60" fill="#fff8c5" stroke="#d4a72c" stroke-width="2" class="box"/>
  <text x="360" y="200" text-anchor="middle" class="title" fill="#7d4e00">Predictor（世界模型核心）</text>
  <text x="360" y="220" text-anchor="middle" class="note">"根据当下状态+动作，推演未来状态"</text>

  <!-- Arrow: s_pred -->
  <line x1="360" y1="230" x2="360" y2="265" class="arrow" stroke="#d4a72c" stroke-width="2" marker-end="url(#ah)"/>
  <text x="390" y="250" class="note" fill="#7d4e00">ŝₜ₊₁</text>

  <!-- Bottom branch: Target Encoder -->
  <!-- Side arrow from input to Target Encoder -->
  <path d="M360,38 L360,55 L620,55 L620,290" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polygon points="620,290 616,282 624,282" fill="#57606a"/>
  <text x="500" y="50" class="note" fill="#57606a">另一视角 / 未来时刻 / 被遮挡区域</text>

  <!-- Target Encoder Box -->
  <rect x="490" y="295" width="260" height="60" fill="#ffebe9" stroke="#ff8182" stroke-width="2" class="box"/>
  <text x="620" y="325" text-anchor="middle" class="title" fill="#cf222e">Target Encoder（EMA）</text>
  <text x="620" y="345" text-anchor="middle" class="note">客观参照："现实是什么样，不由你决定"</text>

  <!-- Arrow up from Target to comparison -->
  <line x1="620" y1="295" x2="620" y2="280" class="arrow" stroke="#cf222e" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="635" y="288" class="note" fill="#cf222e">sₜ₊₁</text>

  <!-- Loss comparison -->
  <rect x="310" y="275" width="100" height="36" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" class="box"/>
  <text x="360" y="298" text-anchor="middle" class="label" fill="#24292f" font-size="13px">Loss = ||ŝ−s||²</text>

  <!-- Arrows into loss -->
  <line x1="360" y1="265" x2="360" y2="275" class="arrow" stroke="#57606a" stroke-width="1.5"/>
  <line x1="620" y1="280" x2="410" y2="293" class="arrow" stroke="#57606a" stroke-width="1.5"/>

  <!-- Legend at bottom left -->
  <rect x="30" y="340" width="20" height="14" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5" class="box"/>
  <text x="58" y="351" class="note">可学习（梯度更新）</text>

  <rect x="30" y="365" width="20" height="14" fill="#ffebe9" stroke="#ff8182" stroke-width="1.5" class="box"/>
  <text x="58" y="376" class="note">EMA 滑动（无梯度）</text>

  <rect x="30" y="390" width="20" height="14" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5" class="box"/>
  <text x="58" y="401" class="note">世界模型核心</text>
</svg>