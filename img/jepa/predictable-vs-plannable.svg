<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="title desc">
  <title id="title">预测准确不等于规划容易</title>
  <desc id="desc">左侧普通潜空间距离把墙两侧的起点和目标判断得很近，却无法到达；右侧价值塑形的距离沿合法绕行路径变化，允许规划器先远离目标再到达。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fa"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.10"/>
    </filter>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a7f37"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .headline { font-size: 22px; font-weight: 700; fill: #1f2328; }
      .panel-title { font-size: 15px; font-weight: 700; }
      .body { font-size: 12px; fill: #1f2328; }
      .tiny { font-size: 10px; fill: #57606a; }
      .state { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .light { fill: #ffffff; }
    </style>
  </defs>

  <rect width="720" height="470" rx="16" fill="url(#bg)"/>
  <text x="360" y="36" text-anchor="middle" class="headline">能预测每一步，不等于容易找到整条路</text>

  <rect x="24" y="59" width="326" height="335" rx="14" fill="#ffffff" stroke="#ff8182" filter="url(#shadow)"/>
  <rect x="370" y="59" width="326" height="335" rx="14" fill="#ffffff" stroke="#4ac26b" filter="url(#shadow)"/>

  <text x="187" y="88" text-anchor="middle" class="panel-title" fill="#cf222e">普通 latent distance</text>
  <text x="533" y="88" text-anchor="middle" class="panel-title" fill="#1a7f37">value-shaped distance</text>
  <text x="187" y="108" text-anchor="middle" class="tiny">相似度很近，但行动代价没有进入几何</text>
  <text x="533" y="108" text-anchor="middle" class="tiny">表示距离沿真实可达路径变化</text>

  <g>
    <rect x="48" y="124" width="278" height="209" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <path d="M73 164H301 M73 294H301" stroke="#d8dee4" stroke-dasharray="4 5"/>
    <rect x="179" y="137" width="18" height="164" rx="4" fill="#6e7781"/>
    <path d="M179 137H197 M179 301H197" stroke="#1f2328" stroke-width="3"/>
    <circle cx="102" cy="218" r="17" fill="#0969da"/>
    <text x="102" y="222" text-anchor="middle" class="state">S</text>
    <circle cx="274" cy="218" r="17" fill="#1a7f37"/>
    <text x="274" y="222" text-anchor="middle" class="state">G</text>
    <path d="M120 218H175" stroke="#cf222e" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
    <path d="M203 218H256" stroke="#cf222e" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
    <path d="M170 204L206 232 M206 204L170 232" stroke="#cf222e" stroke-width="5" stroke-linecap="round"/>
    <rect x="110" y="263" width="155" height="35" rx="8" fill="#ffebe9" stroke="#ff8182"/>
    <text x="187.5" y="278" text-anchor="middle" class="body" fill="#cf222e">d(S,G) 很小</text>
    <text x="187.5" y="292" text-anchor="middle" class="tiny">梯度把规划器推向墙</text>
  </g>

  <g>
    <rect x="394" y="124" width="278" height="209" rx="10" fill="#f6fff8" stroke="#b4e5bc"/>
    <path d="M419 164H647 M419 294H647" stroke="#d3eed8" stroke-dasharray="4 5"/>
    <rect x="525" y="137" width="18" height="164" rx="4" fill="#6e7781"/>
    <path d="M525 137H543 M525 301H543" stroke="#1f2328" stroke-width="3"/>
    <circle cx="448" cy="218" r="17" fill="#0969da"/>
    <text x="448" y="222" text-anchor="middle" class="state">S</text>
    <circle cx="620" cy="218" r="17" fill="#1a7f37"/>
    <text x="620" y="222" text-anchor="middle" class="state">G</text>
    <path d="M466 220 C475 315, 581 343, 612 239" fill="none" stroke="#1a7f37" stroke-width="5" stroke-linecap="round" marker-end="url(#green-arrow)"/>
    <circle cx="487" cy="284" r="5" fill="#8ddb9b"/>
    <circle cx="535" cy="319" r="6" fill="#4ac26b"/>
    <circle cx="583" cy="294" r="7" fill="#2da44e"/>
    <text x="478" y="266" class="tiny" fill="#1a7f37">先变远</text>
    <text x="566" y="326" class="tiny" fill="#1a7f37">V ↑</text>
    <rect x="456" y="151" width="155" height="35" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="533.5" y="166" text-anchor="middle" class="body" fill="#1a7f37">d(S,G) ≈ 行动代价</text>
    <text x="533.5" y="180" text-anchor="middle" class="tiny">合法绕路拥有连续地形</text>
  </g>

  <text x="187" y="366" text-anchor="middle" class="body" fill="#cf222e">知道下一步在哪，却卡在局部最优</text>
  <text x="533" y="366" text-anchor="middle" class="body" fill="#1a7f37">允许短期退让，换取最终可达</text>

  <rect x="54" y="414" width="612" height="38" rx="19" fill="#24292f"/>
  <text x="360" y="438" text-anchor="middle" class="body light">
    预测准确：知道每一步会到哪里　≠　规划容易：知道哪条路值得走
  </text>
</svg>
